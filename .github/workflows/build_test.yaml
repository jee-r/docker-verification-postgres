name: Build_Test

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  push:
    branches:
      - '*'
      - '!main'
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: Build and test PG ${{ matrix.pg_major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_major: ['12', '13', '14', '15', '16', '17', '18']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (amd64, loaded for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: PG_MAJOR=${{ matrix.pg_major }}
          platforms: linux/amd64
          load: true
          tags: verification-postgres:test-${{ matrix.pg_major }}

      - name: Test extensions
        run: sh scripts/test.sh verification-postgres:test-${{ matrix.pg_major }} ${{ matrix.pg_major }}

      - name: Build image (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: PG_MAJOR=${{ matrix.pg_major }}
          platforms: linux/arm64
          push: false

  # Single status to mark as required in the main branch ruleset, so GitHub
  # native auto-merge can merge Renovate PRs without listing every matrix job.
  result:
    name: Build_Test result
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check matrix result
        run: test "${{ needs.build.result }}" = "success"
