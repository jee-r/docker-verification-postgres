name: Deploy

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  # Weekly rebuild to pick up PGDG package updates. Upstream image updates
  # arrive through Renovate digest bumps merged into main.
  schedule:
    - cron: '33 3 * * 1'

jobs:
  build:
    name: Build, test and publish PG ${{ matrix.pg_major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_major: ['12', '13', '14', '15', '16', '17', '18']
    steps:
      - name: Set image variables
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/$(echo '${{ github.repository }}' | sed 's|^jee-r/docker-||')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (amd64, loaded for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: PG_MAJOR=${{ matrix.pg_major }}
          platforms: linux/amd64
          load: true
          tags: verification-postgres:test-${{ matrix.pg_major }}

      - name: Test extensions
        run: sh scripts/test.sh verification-postgres:test-${{ matrix.pg_major }} ${{ matrix.pg_major }}

      # Reuses the builder's local layer cache from the test build above.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: PG_MAJOR=${{ matrix.pg_major }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.pg_major }}
            ${{ env.IMAGE }}:${{ matrix.pg_major }}-${{ env.SHORT_SHA }}
